name: skypallet-book
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.10
  - cartopy
  - matplotlib
  - netcdf4
  - pandas
  - xarray
  - windrose
  - pip:
    - "jupyter-book<0.16"
    - cookiecutter
    - pytest
    - black
    - ghp-import
    - orcestra
prefix: /opt/miniconda3/envs/skypallet-book
